name: Probe Modern Control Homework

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/modern-control-probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-zju.txt
      - name: Fetch Modern Control homework list
        env:
          ZJU_USERNAME: ${{ secrets.ZJU_USERNAME }}
          ZJU_PASSWORD: ${{ secrets.ZJU_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json, requests
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("zju_sync", "scripts/fetch-zju-direct.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          s = requests.Session()
          s.headers.update({"User-Agent": mod.UA, "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7"})
          mod.login_zjuam(s)
          mod.login_courses(s)

          course_id = 100211
          course_name = "现代控制理论"

          course_meta = mod.api_json(s, f"https://courses.zju.edu.cn/api/courses/{course_id}")
          semesters_meta = mod.api_json(s, "https://courses.zju.edu.cn/api/my-semesters?fields=id,name,sort,is_active,code")
          payload = mod.api_json(s, f"https://courses.zju.edu.cn/api/courses/{course_id}/homework-activities?page=1&page_size=1000")
          activities = payload.get("activities") or payload.get("homework_activities") or []
          status_payload = mod.api_json(s, f"https://courses.zju.edu.cn/api/course/{course_id}/homework/submission-status?no-intercept=true")
          statuses = status_payload.get("homework_activities") or []
          status_map = {x.get("id"): x.get("status_code") for x in statuses if isinstance(x, dict)}

          rows = []
          for a in activities:
              if not isinstance(a, dict):
                  continue
              row = {
                  "id": a.get("id"),
                  "title": a.get("title"),
                  "type": a.get("type"),
                  "published": a.get("published"),
                  "start_time": a.get("start_time"),
                  "end_time": a.get("end_time"),
                  "status_code": status_map.get(a.get("id")),
              }
              rows.append(row)

          rows.sort(key=lambda x: (x.get("end_time") or "", x.get("id") or 0), reverse=True)

          # Fully normalize/download attachments for the newest few homework activities.
          details = []
          for a in rows[:5]:
              todo = {
                  "id": a.get("id"),
                  "course_id": course_id,
                  "course_name": course_name,
                  "course_code": "(2026-2027-1)-CSE3000M-0003225-1",
                  "title": a.get("title"),
                  "type": "homework",
                  "end_time": a.get("end_time"),
                  "is_locked": False,
              }
              try:
                  details.append(mod.normalize_todo(s, todo))
              except Exception as exc:
                  details.append({"id": a.get("id"), "title": a.get("title"), "error": f"{type(exc).__name__}: {exc}"})

          Path("data/modern_control_probe.json").write_text(
              json.dumps({"course_meta": course_meta, "semesters_meta": semesters_meta, "homework_list": rows, "details": details}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit probe result and downloaded files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/modern_control_probe.json course_materials/现代控制理论 || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: inspect modern-control homework"
          git pull --rebase origin main
          git push origin HEAD:main