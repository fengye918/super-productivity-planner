name: Extract new homework question previews

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export-homework-text.py"
      - ".github/homework-extract-trigger"

permissions:
  contents: write

concurrency:
  group: homework-previews
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parsers
        run: python -m pip install --disable-pip-version-check pymupdf python-pptx
      - name: Extract originals with page images
        run: python scripts/export-homework-text.py
      - name: Publish question previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/homework_previews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: extract question previews for answer verification"
          git pull --rebase origin main
          git push origin HEAD:main
