name: Build course solution PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "course_materials/**/solutions/source/*.tex"
      - ".github/workflows/build-course-solutions.yml"
      - ".github/build-solutions-trigger"

permissions:
  contents: write

concurrency:
  group: build-course-solutions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-xetex texlive-lang-chinese texlive-latex-extra fonts-noto-cjk

      - name: Build all solution PDFs
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' src; do
            found=1
            solutions_dir="$(dirname "$(dirname "$src")")"
            name="$(basename "${src%.tex}")"
            out_pdf="$solutions_dir/$name.pdf"
            work="$(mktemp -d)"
            echo "Building $src -> $out_pdf"
            xelatex -interaction=nonstopmode -halt-on-error -output-directory "$work" "$src" >/tmp/xelatex.log
            xelatex -interaction=nonstopmode -halt-on-error -output-directory "$work" "$src" >>/tmp/xelatex.log
            cp "$work/$name.pdf" "$out_pdf"
            rm -rf "$work"
          done < <(find course_materials -type f -path "*/solutions/source/*.tex" -print0 | sort -z)

          if [ "$found" -eq 0 ]; then
            echo "No solution source files found."
          fi

      - name: Commit generated PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_materials
          if git diff --cached --quiet; then
            echo "Solution PDFs already up to date."
            exit 0
          fi
          git commit -m "docs: build course solution PDFs"
          git pull --rebase origin main
          git push origin HEAD:main
