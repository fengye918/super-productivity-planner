name: Fetch latest sensor lesson PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-sensor-lesson.py"
      - ".github/workflows/fetch-sensor-lesson.yml"

permissions:
  contents: write

concurrency:
  group: fetch-sensor-lessons
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Fetch exact PDF slide pages
        env:
          ZJU_USERNAME: ${{ secrets.ZJU_USERNAME }}
          ZJU_PASSWORD: ${{ secrets.ZJU_PASSWORD }}
        run: python scripts/fetch-sensor-lesson.py
      - name: Commit source slides and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "course_materials/传感与检测/课件" data/sensor_homework_previews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: archive authentic latest sensor lecture and last-page questions"
          git pull --rebase origin main
          git push origin HEAD:main
