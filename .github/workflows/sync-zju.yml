name: Sync 学在浙大

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/zju-sync-trigger"
  schedule:
    # UTC = Asia/Shanghai - 8h
    - cron: "15 0 * * *"
    - cron: "45 4 * * *"
    - cron: "15 10 * * *"
    - cron: "15 14 * * *"

permissions:
  contents: write

concurrency:
  group: zju-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-zju.txt

      - name: Fetch 学在浙大 todos
        env:
          ZJU_USERNAME: ${{ secrets.ZJU_USERNAME }}
          ZJU_PASSWORD: ${{ secrets.ZJU_PASSWORD }}
        shell: bash
        run: |
          set +e
          python scripts/fetch-zju-direct.py
          direct_status=$?

          if [ "$direct_status" -ne 0 ]; then
            echo "Browser-like direct authentication failed; trying Zhejiang University WebVPN."
            python scripts/fetch-zju-webvpn.py
            vpn_status=$?
          else
            vpn_status=0
          fi
          set -e

          if [ "$direct_status" -ne 0 ] && [ "$vpn_status" -ne 0 ]; then
            echo "All ZJU authentication paths failed."
            exit 1
          fi

      - name: Commit changed todo data
        shell: bash
        run: |
          if git diff --quiet -- data course_materials; then
            echo "No todo changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data course_materials
          git commit -m "chore(zju): sync assignments"
          git pull --rebase origin main
          git push origin HEAD:main