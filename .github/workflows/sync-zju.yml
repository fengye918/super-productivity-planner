name: Sync 学在浙大

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/zju-sync-trigger"
  schedule:
    - cron: "15 0 * * *"
    - cron: "45 4 * * *"
    - cron: "15 10 * * *"
    - cron: "15 14 * * *"

permissions:
  contents: write

concurrency:
  group: zju-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-zju.txt

      - name: Fetch 学在浙大 todos
        env:
          ZJU_USERNAME: ${{ secrets.ZJU_USERNAME }}
          ZJU_PASSWORD: ${{ secrets.ZJU_PASSWORD }}
        run: python scripts/fetch-zju-direct.py

      - name: Commit changed data/materials
        shell: bash
        run: |
          if git diff --quiet -- data course_materials; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data course_materials
          git commit -m "chore(zju): sync assignments"
          git pull --rebase origin main
          git push origin HEAD:main
