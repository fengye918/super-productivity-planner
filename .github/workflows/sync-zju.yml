name: Sync 学在浙大

on:
  workflow_dispatch:
  schedule:
    # Asia/Shanghai: 08:15, 12:45, 18:15, 22:15
    - cron: "15 0 * * *"
    - cron: "45 4 * * *"
    - cron: "15 10 * * *"
    - cron: "15 14 * * *"

permissions:
  contents: write

concurrency:
  group: zju-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fetch 学在浙大 todos
        env:
          ZJU_USERNAME: ${{ secrets.ZJU_USERNAME }}
          ZJU_PASSWORD: ${{ secrets.ZJU_PASSWORD }}
        run: node scripts/fetch-zju.mjs

      - name: Commit changed todo data
        shell: bash
        run: |
          if git diff --quiet -- data/zju_todos.json data/zju_changes.json; then
            echo "No todo changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zju_todos.json data/zju_changes.json
          git commit -m "chore(zju): sync assignments"
          git pull --rebase origin main
          git push origin HEAD:main
